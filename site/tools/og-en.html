<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0b1020; }
  body { font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #f5f5f5; }
  .card { inline-size: 1200px; block-size: 630px; position: relative; overflow: hidden;
    background:
      radial-gradient(720px 480px at 88% 8%, rgb(13 115 119 / 42%), transparent 62%),
      radial-gradient(560px 420px at 6% 96%, rgb(20 255 236 / 14%), transparent 60%),
      linear-gradient(150deg, #1a1a2e 0%, #121a2b 58%, #0e1524 100%);
    padding: 54px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .card::after { content: ""; position: absolute; inset-block-start: 0; inset-inline: 0; block-size: 5px;
    background: linear-gradient(90deg, #0d7377, #14ffec 45%, #d4af37); }
  .top { display: flex; align-items: center; gap: 18px; }
  .mark { inline-size: 62px; block-size: 62px; border-radius: 16px; background: #071a3a;
    display: grid; place-items: center; border: 1px solid rgb(20 255 236 / 28%); }
  .mark svg { inline-size: 34px; block-size: 34px; }
  .name { display: flex; flex-direction: column; gap: 2px; }
  .name b { font-size: 30px; font-weight: 700; color: #d4af37; line-height: 1.1; }
  .name span { font-family: system-ui, "Segoe UI", sans-serif; font-size: 15px; letter-spacing: .28em;
    color: #9fb3c8; text-transform: uppercase; }
  h1 { font-size: 60px; line-height: 1.14; font-weight: 700; max-inline-size: 18ch; }
  h1 em { font-style: normal; color: #14ffec; }
  .lede { margin-block-start: 16px; font-size: 23px; color: #b0b0b0; max-inline-size: 40ch; line-height: 1.45; }
  .row { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .chip { font-size: 17px; padding: 7px 15px; border-radius: 999px; border: 1px solid rgb(20 255 236 / 34%);
    background: rgb(13 115 119 / 22%); color: #d7f4f3; }
  .chip--gold { border-color: rgb(212 175 55 / 45%); background: rgb(212 175 55 / 14%); color: #f0dca4; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .url { font-family: ui-monospace, Consolas, monospace; font-size: 19px; color: #7f93a8; direction: ltr; white-space: nowrap; }
  .dots { display: flex; gap: 10px; }
  .dots i { inline-size: 13px; block-size: 13px; border-radius: 50%; display: block; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="top">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#14ffec" stroke-width="1.7" stroke-linecap="round"><path d="M12 3.2 13.9 9 20 12l-6.1 3L12 20.8 10.1 15 4 12l6.1-3z"/><path d="M6 21h12" stroke="#d4af37"/></svg></span>
        <span class="name"><b>النور</b><span>AlNoor</span></span>
      </div>
      <div style="margin-block-start:40px">
        <h1>Come back to your prayer — <em>without leaving your phone.</em></h1>
        <p class="lede">Prayer times, the full Qur’an, adhkar and a private worship tracker. Free, offline, no account.</p>
      </div>
    </div>
    <div class="foot">
      <div class="row"><span class="chip">Prayer times</span><span class="chip">Qur’an &amp; recitation</span><span class="chip">Adhkar</span><span class="chip">Qibla</span><span class="chip chip--gold">Free on Android</span></div>
      <div style="display:flex;align-items:center;gap:22px">
        <span class="dots"><i style="background:#6b5b95"></i><i style="background:#88b04b"></i><i style="background:#ff6f61"></i><i style="background:#d4af37"></i><i style="background:#14ffec"></i></span>
        <span class="url">github.com/seifjo/Back-to-pray</span>
      </div>
    </div>
  </div>
</body>
</html>
